<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Registro de cuadrillas</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script src="guard.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a66">
<meta name="application-name" content="Registro Cuadrillas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro Cuadrillas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- Librerías para generar el PDF del resumen (alojadas en este repositorio) -->
<script src="vendor/html2canvas-1.4.1.min.js" defer></script>
<script src="vendor/jspdf-2.5.1.umd.min.js" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #edf1f8; --surface: #ffffff; --surface-2: #f7f9fc;
    --line: #e3e8ef; --line-strong: #cdd5e0;
    --ink: #101828; --ink-2: #475467; --ink-3: #5d6778;
    --accent: #0f5bd8; --accent-strong: #0b47ad; --accent-soft: rgba(15,91,216,.09);
    --brand: #0a2a66; --brand-2: #0f5bd8; --teal: #0f9d8a; --teal-ink: #0b6f63; --teal-soft: #d5f3ee; --amber-soft: #fdecc8; --amber-ink: #8a4b00; --rose-soft: #fde0e6; --rose-ink: #a3143a; --blue-soft: #dbe8ff; --blue-ink: #1b46a8;
    --ok-bg: #e3f4ea; --ok-ink: #14633a;
    --warn-bg: #fdf0d5; --warn-ink: #7a4a00;
    --bad-bg: #fbe4e1; --bad-ink: #8f1d14;
    --plate-bg: #ffffff;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  ::selection { background: var(--accent); color: #ffffff; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- controles ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: 14px; white-space: nowrap;
    transition: transform 140ms var(--ease), background-color 150ms var(--ease), border-color 150ms var(--ease); }
  a.btn { text-decoration: none; color: var(--ink); }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.text { border-color: transparent; background: transparent; color: var(--accent); padding: 0 10px; }
  .btn.text:hover { background: var(--accent-soft); }
  .btn.danger { border-color: transparent; background: transparent; color: var(--bad-ink); padding: 0 10px; height: 34px; font-size: 13px; }
  .btn.danger:hover { background: var(--bad-bg); }
  .btn.sm { height: 34px; font-size: 13px; padding: 0 12px; }
  .icon-btn { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; display: inline-grid; place-items: center; color: var(--ink-3);
    transition: transform 140ms var(--ease), background-color 150ms var(--ease), color 150ms var(--ease); }
  .icon-btn:hover { background: var(--bad-bg); color: var(--bad-ink); }
  .icon-btn:active { transform: scale(0.94); }
  @media (pointer: coarse) { .btn { min-height: 46px; } .btn.sm, .btn.danger { min-height: 40px; } .icon-btn { width: 44px; height: 44px; } }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label, .lbl { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  input[type=text], input[type=date], select.ctl { height: 46px; width: 100%; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--ink); padding: 0 12px; font: inherit; font-size: 15px; font-weight: 500; transition: border-color 150ms var(--ease); }
  input[type=text]:hover, input[type=date]:hover, select.ctl:hover { border-color: var(--ink-3); }
  input[type=text] { text-transform: uppercase; text-overflow: ellipsis; }
  input[readonly] { background: var(--surface-2); color: var(--ink-3); }
  select.ctl { appearance: none; padding-right: 36px; cursor: pointer; }
  ::placeholder { color: var(--ink-3); opacity: .7; text-transform: none; font-weight: 400; }
  .person input::placeholder { font-size: 14px; }
  input.invalid { border-color: var(--bad-ink); background: var(--bad-bg); }
  @media (pointer: coarse) { input[type=text], input[type=date], select.ctl { font-size: 16px; } }

  /* ---------- barra superior ---------- */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg.mark { width: 34px; height: 24px; flex-shrink: 0; }
  .brand .t { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; }
  .bar-r { display: flex; align-items: center; gap: 10px; }
  .today { text-align: right; line-height: 1.2; }
  .today span { display: block; font-size: 11px; color: var(--ink-3); }
  .today b { font-size: 13px; font-weight: 500; }
  @media (max-width: 480px) { .today { display: none; } }

  /* ---------- estructura ---------- */
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 140px; display: flex; flex-direction: column; gap: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .panel + .panel { margin-top: 0; }
  .sec-title { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .sec-sub { margin: -10px 0 14px; color: var(--ink-3); font-size: 13px; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .two { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .divider { height: 1px; background: var(--line); margin: 4px 0; }

  .notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line-strong); background: var(--surface);
    border-radius: 12px; padding: 12px 16px; }
  .notice p { margin: 0; color: var(--ink-2); font-size: 13px; }
  .notice p b { color: var(--ink); font-weight: 600; }
  .notice .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .notice.edit { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------- tarjeta de cuadrilla ---------- */
  .card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .card-h h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .card-h p { margin: 2px 0 0; color: var(--ink-3); font-size: 13px; }
  .date-row { display: flex; align-items: center; gap: 10px; }
  .date-row input { flex: 1; min-width: 0; }
  .dia { flex-shrink: 0; min-width: 104px; height: 46px; display: grid; place-items: center; padding: 0 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; }
  .plate-in { font-family: var(--mono) !important; font-weight: 600 !important; letter-spacing: .08em; }

  .people-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .count { white-space: nowrap; flex-shrink: 0; font-size: 12px; font-weight: 500; color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--line); padding: 2px 10px; border-radius: 12px; }
  .count.full { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
  .people { display: flex; flex-direction: column; gap: 10px; }
  .person { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); animation: rise 180ms var(--ease) backwards; }
  .person { position: relative; }
  .person:focus-within { z-index: 31; }
  .badge { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 22px;
    background: var(--accent-soft); color: var(--accent); }
  .person .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .person .body > label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .person .x { margin-top: 18px; }
  .quick { align-self: flex-start; font-size: 12px; }
  .adds { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .add { height: 46px; border: 1px dashed var(--line-strong); border-radius: 10px; background: transparent; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500;
    transition: transform 140ms var(--ease), background-color 150ms var(--ease), border-color 150ms var(--ease); }
  .add:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .add:active { transform: scale(0.98); }
  .add:disabled { opacity: .45; pointer-events: none; }
  @media (min-width: 640px) { .adds { grid-template-columns: repeat(3, 1fr); } .two { grid-template-columns: 1fr 1fr; } }

  .locked { opacity: .65; }
  .lock-note { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }

  /* ---------- listas desplegables ---------- */
  .cb { position: relative; }
  .cb input { padding-right: 34px; }
  .cb .chev { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
  .cbm { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 220px; overflow-y: auto; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 8px; z-index: 30; box-shadow: 0 8px 24px -6px rgba(0,0,0,.22); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .cb.open .cbm { display: block; animation: rise 150ms var(--ease) backwards; }
  .cbi { padding: 12px; font-size: 14px; font-weight: 500; text-transform: uppercase; cursor: pointer; border-bottom: 1px solid var(--line); user-select: none; -webkit-user-select: none; }
  .cbi:last-child { border-bottom: 0; }
  .cbi:hover, .cbi:active { background: var(--accent-soft); color: var(--accent); }
  .cbn { padding: 12px; font-size: 12px; color: var(--ink-3); font-style: italic; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- barra inferior ---------- */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .dock .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .dock .btn { flex: 1; height: 48px; font-size: 15px; }
  @media (max-width: 480px) { .dock .in { flex-direction: column; } .dock .btn { height: 46px; } }

  /* ---------- carga y ventanas ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  .loadbox { background: var(--surface); border-radius: 12px; padding: 20px 24px; display: flex; align-items: center; gap: 14px; font-weight: 500; }
  .modal { width: 100%; max-width: 460px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; animation: rise 200ms var(--ease) backwards; }
  .modal h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .modal .lead { margin: 0 0 18px; color: var(--ink-2); }
  .okmark { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok-ink); margin-bottom: 14px; }
  .okmark svg { width: 22px; height: 22px; stroke-width: 2.25; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface);
    transition: transform 140ms var(--ease), background-color 150ms var(--ease), border-color 150ms var(--ease); }
  .opt:hover { background: var(--surface-2); border-color: var(--ink-3); }
  .opt:active { transform: scale(0.985); }
  .opt b { display: block; font-weight: 600; font-size: 15px; }
  .opt span { display: block; color: var(--ink-3); font-size: 13px; margin-top: 1px; }
  .opt.main { background: var(--accent); border-color: var(--accent); color: #ffffff; }
  .opt.main span { color: #ffffff; opacity: .8; }
  .opt.main:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .opt:disabled { opacity: .5; pointer-events: none; }
  .sum-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .sum-card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .plate { font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: .08em; padding: 2px 8px; border: 1.5px solid var(--ink); border-radius: 5px; background: var(--plate-bg); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px; padding: 3px 0; font-size: 13px; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .modal .row-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .modal .row-btns .btn { flex: 1; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 8px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease), transform 180ms var(--ease); z-index: 70; max-width: 92vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: 1ms !important; } }

  /* ===== Capa visual: más color en lo importante, datos más claros ===== */
  html, body { background: var(--ground); }
  .bar { background: var(--brand); border-bottom: 0; color: #fff; box-shadow: 0 6px 18px -10px rgba(10,42,102,.7); }
  .brand .t, .brand svg.mark { color: #fff; }
  .brand svg.mark circle { fill: #7fb2ff; } .brand svg.mark path:not(:first-child) { stroke: #7fb2ff; }
  .bar .btn, .bar a.btn { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
  .bar .btn:hover, .bar a.btn:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.55); }
  .bar .btn.sm.on { background: #fff; color: var(--brand); border-color: #fff; }
  .bar .icon-btn { color: rgba(255,255,255,.85); } .bar .icon-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .bar .stamp, .bar .who span, .bar .today span { color: rgba(255,255,255,.7); }
  .bar .who b, .bar .today b { color: #fff; }
  .btn.primary { box-shadow: 0 8px 18px -10px rgba(15,91,216,.9); }
  .panel, .card { box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px -14px rgba(16,24,40,.25); }
  .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; background: linear-gradient(160deg, var(--brand-2), var(--brand)); color: #fff; box-shadow: 0 6px 14px -8px rgba(10,42,102,.8); }
  .num svg { width: 20px; height: 20px; }
  .lt { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .plate { background: #fffdf2; border-color: var(--brand); color: var(--brand); box-shadow: inset 4px 0 0 var(--brand-2); padding-left: 14px; }
  .pin { display: inline-flex; align-items: center; gap: 4px; }
  .pin svg { width: 13px; height: 13px; }
  .role-COORDINADOR { --rb: var(--blue-soft); --ri: var(--blue-ink); }
  .role-T1 { --rb: var(--teal-soft); --ri: var(--teal-ink); }
  .role-T2 { --rb: var(--amber-soft); --ri: var(--amber-ink); }
  .role-USUARIO { --rb: var(--rose-soft); --ri: var(--rose-ink); }

  .card-h h2 { font-size: 19px; font-weight: 600; }
  .card-h .lt p { margin: 2px 0 0; }
  .panel { border-radius: 14px; }
  .field > label, .lbl { color: var(--ink); font-weight: 600; }
  .dia { background: var(--accent-soft); color: var(--accent); }
  .count { font-weight: 600; }
  .count.full { background: #d9f5e3; color: #0f6a37; }
  .badge { background: var(--rb, var(--accent-soft)); color: var(--ri, var(--accent)); font-weight: 700; }
  .person[data-tipo="T1"] { --rb: var(--teal-soft); --ri: var(--teal-ink); }
  .person[data-tipo="T2"] { --rb: var(--amber-soft); --ri: var(--amber-ink); }
  .person[data-tipo="USUARIO"] { --rb: var(--rose-soft); --ri: var(--rose-ink); }
  .person { background: #fff; border-color: var(--line-strong); }
  .add { font-weight: 600; }
  .add[data-add="T1"] { background: rgba(15,157,138,.07); border-color: rgba(15,157,138,.55); color: var(--teal-ink); }
  .add[data-add="T2"] { background: rgba(217,119,6,.07); border-color: rgba(217,119,6,.55); color: var(--amber-ink); }
  .add[data-add="USUARIO"] { background: rgba(190,24,93,.06); border-color: rgba(190,24,93,.45); color: var(--rose-ink); }
  .add:hover { filter: brightness(.97); border-style: solid; }
  .add:disabled { filter: grayscale(.8); }
  .dock { box-shadow: 0 -10px 24px -16px rgba(16,24,40,.35); }
  .dock .btn.primary { box-shadow: 0 10px 20px -10px rgba(15,91,216,.95); }
  .okmark { background: #16a34a; color: #fff; box-shadow: 0 10px 20px -10px rgba(22,163,74,.9); }
  .opt.main { box-shadow: 0 10px 20px -12px rgba(15,91,216,.9); }
  .notice { background: #fff; border-color: var(--line-strong); }
  .notice.edit { background: #eaf1ff; border-color: #9db9f3; }
  .sum-card { background: #fff; border-color: var(--line-strong); }
  .sum-card h3 { color: var(--brand); }
</style>
</head>
<body>

<header class="bar">
  <div class="brand" id="brand"></div>
  <div class="bar-r">
    <div class="today"><span>Hoy</span><b id="currentDateDisplay">--</b></div>
    <a class="btn sm" id="linkPanel" href="panel.html">Panel</a>
  </div>
</header>

<form id="mainForm" class="wrap" novalidate>
  <div id="bannerSlot"></div>

  <!-- Módulo 1: sede y coordinador (valen para todas las cuadrillas del envío) -->
  <section class="panel stack" id="bloqueGeneral">
    <div class="field">
      <label for="inputSede">Sede de operaciones</label>
      <div class="cb" style="position:relative">
        <select id="inputSede" class="ctl" required><option value="" disabled selected>Seleccionar sede</option></select>
        <span class="chev" id="chevSede" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none"></span>
      </div>
    </div>
    <div class="field">
      <label>Nombre del coordinador</label>
      <div id="coordinadorWrapper"></div>
    </div>
  </section>

  <!-- Módulo 2 en adelante: una tarjeta por cuadrilla -->
  <div id="cuadrillasContainer" class="stack" style="gap:16px"></div>
</form>

<div class="dock">
  <div class="in">
    <button type="button" class="btn" id="btnAddCuadrilla"></button>
    <button type="submit" form="mainForm" class="btn primary" id="btnSubmit">Enviar registros</button>
  </div>
</div>

<div id="overlay"></div>
<div class="toast" id="toast" role="status"></div>

<script src="form.js"></script>
<script src="pwa.js"></script>
</body>
</html>
