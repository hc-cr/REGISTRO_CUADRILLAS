<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Registro de cuadrillas</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script src="guard.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2a66">
<meta name="application-name" content="Registro Cuadrillas">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro Cuadrillas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #edf1f8; --surface: #ffffff; --surface-2: #f7f9fc;
    --line: #e3e8ef; --line-strong: #cdd5e0;
    --ink: #101828; --ink-2: #475467; --ink-3: #5d6778;
    --accent: #0f5bd8; --accent-strong: #0b47ad; --accent-soft: rgba(15,91,216,.09);
    --brand: #0a2a66; --brand-2: #0f5bd8; --teal: #0f9d8a; --teal-ink: #0b6f63; --teal-soft: #d5f3ee; --amber-soft: #fdecc8; --amber-ink: #8a4b00; --rose-soft: #fde0e6; --rose-ink: #a3143a; --blue-soft: #dbe8ff; --blue-ink: #1b46a8;
    --ok-bg: #e3f4ea; --ok-ink: #14633a;
    --warn-bg: #fdf0d5; --warn-ink: #7a4a00;
    --bad-bg: #fbe4e1; --bad-ink: #8f1d14;
    --plate-bg: #ffffff;
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--accent); color: #ffffff; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- controles ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: 13px; white-space: nowrap;
    transition: transform 140ms var(--ease), background-color 150ms var(--ease), border-color 150ms var(--ease); }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .5; pointer-events: none; }
  .btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn.text { border-color: transparent; background: transparent; color: var(--accent); padding: 0 8px; }
  .btn.text:hover { background: var(--accent-soft); }
  .btn.full { width: 100%; height: 44px; font-size: 14px; }
  .icon-btn { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; display: inline-grid; place-items: center; color: var(--ink-2);
    transition: transform 140ms var(--ease), background-color 150ms var(--ease), color 150ms var(--ease); }
  .icon-btn:hover { background: var(--accent-soft); color: var(--ink); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (pointer: coarse) { .btn, .icon-btn { min-height: 44px; } .icon-btn { width: 44px; } }

  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field > label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .field input:not([type=checkbox]), .field select, select.sel { height: 40px; width: 100%; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
    color: var(--ink); padding: 0 12px; font: inherit; font-size: 14px; transition: border-color 150ms var(--ease); }
  .field input:not([type=checkbox]):hover, .field select:hover { border-color: var(--ink-3); }
  .field input[data-cb], .field input[data-key]:not([type=date]) { text-transform: uppercase; }
  .field input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); vertical-align: -3px; margin-right: 6px; }
  @media (pointer: coarse) { .field input:not([type=checkbox]), .field select { height: 46px; font-size: 16px; } }

  /* ---------- acceso ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .login .box { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  .login .brand { margin-bottom: 20px; }
  .login p { margin: 0 0 20px; color: var(--ink-2); }
  .err { color: var(--bad-ink); font-size: 13px; min-height: 20px; margin: 2px 0 10px; }

  /* ---------- barra superior ---------- */
  .bar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand svg.mark { width: 34px; height: 24px; flex-shrink: 0; }
  .brand .t { font-size: 15px; font-weight: 600; letter-spacing: -0.005em; line-height: 1.2; white-space: nowrap; }
  .brand .s { display: block; font-size: 12px; color: var(--ink-3); font-weight: 400; }
  .bar-r { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .who { text-align: right; line-height: 1.25; margin: 0 6px; min-width: 0; }
  .who b { display: block; font-weight: 500; font-size: 13px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who span { font-size: 12px; color: var(--ink-3); }
  .stamp { font-size: 12px; color: var(--ink-3); margin-right: 2px; white-space: nowrap; }
  .bar-nav { display: flex; gap: 6px; flex: 1; justify-content: flex-end; }
  .btn.sm { height: 34px; font-size: 13px; padding: 0 12px; text-decoration: none; color: var(--ink); }
  a.btn { text-decoration: none; color: var(--ink); }
  .btn.sm.on { background: var(--accent); color: #ffffff; border-color: var(--accent); }
  .noedit { margin: 4px 16px 12px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }

  /* ---------- estructura ---------- */
  .shell { max-width: 1120px; margin: 0 auto; padding: 20px 16px 64px; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px; align-items: start; }
  .side { position: sticky; top: 76px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

  /* ---------- calendario ---------- */
  .cal-head { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .cal-head h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
  .dows, .cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .dows div { text-align: center; font-size: 12px; color: var(--ink-3); padding: 4px 0; font-weight: 500; }
  .cell { position: relative; height: 46px; border: 0; background: transparent; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 14px; color: var(--ink); transition: transform 140ms var(--ease), background-color 150ms var(--ease); }
  .cell:hover { background: var(--accent-soft); }
  .cell:active { transform: scale(0.95); }
  .cell.out { visibility: hidden; pointer-events: none; }
  .cell.wk { color: var(--ink-3); }
  .cell.today .n { color: var(--accent); font-weight: 600; box-shadow: 0 0 0 1.5px var(--accent); }
  .cell .n { min-width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; padding: 0 2px; }
  .cell.sel { background: var(--accent); color: #ffffff; }
  .cell.sel.wk { color: #ffffff; }
  .cell.sel .n { box-shadow: none; color: #ffffff; }
  .dots { display: flex; gap: 3px; height: 5px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .cell.sel .dots i { background: #ffffff; }
  .cal-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  .cal-foot .sum { font-size: 13px; color: var(--ink-2); }
  .cal-foot select { height: 38px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); padding: 0 10px; font: inherit; }

  /* ---------- detalle del día ---------- */
  .day-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .day-sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
  .meter { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .meter .bar-t { flex: 1; max-width: 220px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .meter .bar-t i { display: block; height: 100%; background: var(--accent); transition: width 250ms var(--ease); }
  .cards { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .cards.enter .card { animation: rise 220ms var(--ease) backwards; }
  .cards.enter .card:nth-child(2) { animation-delay: 40ms; } .cards.enter .card:nth-child(3) { animation-delay: 80ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .empty { margin-top: 18px; border: 1px dashed var(--line-strong); border-radius: 10px; padding: 20px 16px; color: var(--ink-2); text-align: center; }
  .errblock { margin-top: 18px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; }
  .errblock p { margin: 0; color: var(--ink-2); }
  .sk { background: var(--line); border-radius: 6px; }
  .sk-card { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  /* ---------- tarjeta de cuadrilla ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; position: relative; }
  .card:focus-within { z-index: 31; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 64px; padding: 14px 16px; border: 0; background: transparent; text-align: left; border-radius: 12px;
    transition: background-color 150ms var(--ease); }
  .card-top:hover { background: var(--surface-2); }
  .card-top:active { background: var(--accent-soft); }
  .card-top .right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .card-top .chev { color: var(--ink-3); transition: transform 200ms var(--ease); display: inline-flex; }
  .card-top[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .card.open .card-top { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .card-body { border-top: 1px solid var(--line); padding-top: 8px; }
  .card-top h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .card-top .loc { color: var(--ink-3); font-size: 13px; margin-top: 1px; }
  .plate { font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: .08em; padding: 3px 10px; border: 1.5px solid var(--ink); border-radius: 6px;
    background: var(--plate-bg); white-space: nowrap; }
  .plate.none { border-style: dashed; border-color: var(--line-strong); color: var(--ink-3); font-weight: 400; }
  .roster { padding: 0 8px 4px; }
  .person { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 6px 8px; border: 0; background: transparent; border-radius: 8px; text-align: left; }
  button.person { transition: background-color 150ms var(--ease), transform 140ms var(--ease); }
  button.person:hover { background: var(--surface-2); }
  button.person:active { transform: scale(0.985); }
  .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
    background: hsl(var(--h) 45% 89%); color: hsl(var(--h) 45% 26%); }
  .av.ghost { background: transparent; border: 1px dashed var(--line-strong); color: var(--ink-3); }
  .person .nm { flex: 1; min-width: 0; }
  .person .nm b { display: block; font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
  .person .nm b.muted { color: var(--ink-3); font-weight: 400; font-style: italic; }
  .person .nm span { font-size: 12px; color: var(--ink-3); }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); white-space: nowrap; }
  .pill.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
  .pill.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .pill.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: transparent; }
  .mark-panel { margin: 0 8px 6px 52px; padding: 10px 12px 12px; background: var(--surface-2); border-radius: 8px; animation: rise 160ms var(--ease) backwards; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chip { height: 40px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500;
    transition: transform 140ms var(--ease), background-color 150ms var(--ease), border-color 150ms var(--ease); }
  .chip:hover { border-color: var(--ink-3); }
  .chip:active { transform: scale(0.96); }
  .chip.on.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
  .chip.on.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .chip.on.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: transparent; }
  .mark-meta { margin-top: 8px; font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  @media (max-width: 480px) { .chips { grid-template-columns: repeat(2, 1fr); } .chip { height: 44px; } .mark-panel { margin-left: 8px; } }

  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 12px; }
  .detail { margin: 0 16px; padding: 12px 0 4px; border-top: 1px solid var(--line); }
  .kv { display: grid; grid-template-columns: 132px 1fr; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .kv:last-of-type { border-bottom: 0; }
  .kv dt { color: var(--ink-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .kv dd.mono { font-family: var(--mono); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0 12px; }
  .hist { margin: 0 16px 12px; border-top: 1px solid var(--line); }
  .hist .h { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .hist .h:last-child { border-bottom: 0; }
  .hist .m { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .hist .old { color: var(--ink-3); text-decoration: line-through; }
  .editbox { padding: 12px 16px 4px; border-top: 1px solid var(--line); margin-top: 4px; }
  .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  @media (max-width: 700px) { .fgrid { grid-template-columns: 1fr; } }

  /* desplegables del modo edición */
  .cb { position: relative; }
  .cbm { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 220px; overflow-y: auto; background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 8px; z-index: 30; box-shadow: 0 8px 24px -6px rgba(0,0,0,.22); touch-action: pan-y; -webkit-overflow-scrolling: touch; }
  .cb.open .cbm { display: block; animation: rise 150ms var(--ease) backwards; }
  .cbi { padding: 11px 12px; font-size: 13px; font-weight: 500; text-transform: uppercase; cursor: pointer; border-bottom: 1px solid var(--line); user-select: none; }
  .cbi:last-child { border-bottom: 0; }
  .cbi:hover, .cbi:active { background: var(--accent-soft); color: var(--accent); }
  .cbn { padding: 11px 12px; font-size: 12px; color: var(--ink-3); font-style: italic; }

  /* ---------- usuarios ---------- */
  .narrow { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }
  .narrow h2 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .urow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .urow .n { flex: 1; min-width: 0; } .urow .n b { font-weight: 500; } .urow .n small { display: block; color: var(--ink-3); font-size: 12px; }
  .sec { margin: 22px 0 6px; font-size: 14px; font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 8px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease), transform 180ms var(--ease); z-index: 60; max-width: 92vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- tablet y teléfono ---------- */
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; gap: 18px; padding-top: 14px; }
    .side { position: static; }
    .stamp, .who span { display: none; }
  }
  @media (max-width: 560px) {
    .bar { padding: 6px 12px; flex-wrap: wrap; }
    .bar-nav { order: 3; width: 100%; flex-basis: 100%; justify-content: flex-start; overflow-x: auto; padding-bottom: 4px; }
    .brand .s, .who { display: none; }
    .shell { padding: 12px 12px 64px; }
    .panel { padding: 12px; }
    .cell { height: 38px; gap: 2px; }
    .cell .n { min-width: 24px; height: 24px; font-size: 13px; }
    .dows div { padding: 2px 0; }
    .cal-head { margin-bottom: 4px; }
    .cal-foot { margin-top: 8px; padding-top: 10px; flex-direction: row; align-items: center; gap: 10px; }
    .cal-foot .sum { flex: 1; font-size: 12px; line-height: 1.3; }
    .cal-foot select { width: 46%; height: 36px; font-size: 13px; }
    .day-title { font-size: 20px; }
    .kv { grid-template-columns: 112px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: 1ms !important; } }

  /* ===== Capa visual: más color en lo importante, datos más claros ===== */
  html, body { background: var(--ground); }
  .bar { background: var(--brand); border-bottom: 0; color: #fff; box-shadow: 0 6px 18px -10px rgba(10,42,102,.7); }
  .brand .t, .brand svg.mark { color: #fff; }
  .brand svg.mark circle { fill: #7fb2ff; } .brand svg.mark path:not(:first-child) { stroke: #7fb2ff; }
  .bar .btn, .bar a.btn { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.3); }
  .bar .btn:hover, .bar a.btn:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.55); }
  .bar .btn.sm.on { background: #fff; color: var(--brand); border-color: #fff; }
  .bar .icon-btn { color: rgba(255,255,255,.85); } .bar .icon-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
  .bar .stamp, .bar .who span, .bar .today span { color: rgba(255,255,255,.7); }
  .bar .who b, .bar .today b { color: #fff; }
  .btn.primary { box-shadow: 0 8px 18px -10px rgba(15,91,216,.9); }
  .panel, .card { box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px -14px rgba(16,24,40,.25); }
  .num { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; background: linear-gradient(160deg, var(--brand-2), var(--brand)); color: #fff; box-shadow: 0 6px 14px -8px rgba(10,42,102,.8); }
  .num svg { width: 20px; height: 20px; }
  .lt { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .plate { background: #fffdf2; border-color: var(--brand); color: var(--brand); box-shadow: inset 4px 0 0 var(--brand-2); padding-left: 14px; }
  .pin { display: inline-flex; align-items: center; gap: 4px; }
  .pin svg { width: 13px; height: 13px; }
  .role-COORDINADOR { --rb: var(--blue-soft); --ri: var(--blue-ink); }
  .role-T1 { --rb: var(--teal-soft); --ri: var(--teal-ink); }
  .role-T2 { --rb: var(--amber-soft); --ri: var(--amber-ink); }
  .role-USUARIO { --rb: var(--rose-soft); --ri: var(--rose-ink); }

  .av[class*="role-"] { background: var(--rb); color: var(--ri); }
  .person .nm b { font-weight: 600; font-size: 15px; }
  .person .nm span { font-weight: 500; color: var(--ri, var(--ink-3)); font-size: 12px; }
  .cell.has:not(.sel) { background: var(--accent-soft); }
  .cell .dots i { background: var(--teal); }
  .cell.today:not(.sel) .n { background: #fff; }
  .cal-head h2 { font-weight: 700; color: var(--brand); }
  .hero { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 115%); color: #fff; border-radius: 16px; padding: 18px 20px; box-shadow: 0 14px 28px -18px rgba(10,42,102,.85); }
  .hero h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .hero .pill-hoy { display: inline-block; vertical-align: 4px; margin-left: 8px; background: #fff; color: var(--brand); font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 12px; }
  .hero .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .hero .st { background: rgba(255,255,255,.15); border-radius: 12px; padding: 8px 14px; min-width: 96px; flex: 0 1 auto; }
  @media (max-width: 560px) { .hero { padding: 16px; } .hero h2 { font-size: 21px; } .hero .stats { gap: 6px; } .hero .st { flex: 1; min-width: 0; padding: 8px 10px; } .hero .st b { font-size: 20px; } .hero .st span { font-size: 11px; } }
  .hero .st b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; }
  .hero .st span { font-size: 12px; opacity: .85; }
  .hero .meter { margin-top: 14px; color: #fff; font-size: 13px; }
  .hero .meter .bar-t { background: rgba(255,255,255,.25); height: 6px; border-radius: 3px; max-width: 260px; }
  .hero .meter .bar-t i { background: #5eead4; }
  .hero .meter.done .bar-t i { background: #4ade80; }
  .hero .vacio { margin: 8px 0 0; opacity: .85; }
  .cards { margin-top: 16px; }
  .card.open { border-color: #b9cdf6; }
  .card-top:hover { background: #f3f7ff; }
  .pill { font-weight: 600; }
  .pill.ok, .pill.warn, .pill.bad, .pill.info { padding-left: 8px; }
  .pill.ok::before, .pill.warn::before, .pill.bad::before, .pill.info::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { background: #d9f5e3; color: #0f6a37; }
  .pill.warn { background: var(--amber-soft); color: var(--amber-ink); }
  .pill.bad { background: var(--rose-soft); color: var(--rose-ink); }
  .pill.info { background: var(--blue-soft); color: var(--blue-ink); }
  .chip { font-weight: 600; }
  .chip.on.ok { background: #16a34a; color: #fff; border-color: #16a34a; }
  .chip.on.warn { background: #d97706; color: #fff; border-color: #d97706; }
  .chip.on.bad { background: #dc2626; color: #fff; border-color: #dc2626; }
  .chip.on.info { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mark-panel { background: #f3f7ff; }
  .kv dt { color: var(--ink-2); font-weight: 500; } .kv dd { font-weight: 600; }
  .detail { margin-top: 4px; }
  .noedit { background: var(--amber-soft); color: var(--amber-ink); font-weight: 500; }
  .stamp { opacity: 1; }
</style>
</head>
<body>

<!-- ACCESO -->
<div class="login hidden" id="loginView">
  <div class="box">
    <div class="brand" id="loginBrand"></div>
    <p>Ingresa con tu DNI y tu PIN.</p>
    <div class="field"><label for="loginDni">DNI</label><input id="loginDni" inputmode="numeric" maxlength="8" autocomplete="username"></div>
    <div class="field"><label for="loginPin">PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary full" id="loginBtn">Ingresar</button>
  </div>
</div>

<!-- APLICACIÓN -->
<div class="hidden" id="appView">
  <header class="bar">
    <div class="brand" id="barBrand"></div>
    <div class="bar-r">
      <span class="stamp" id="stamp"></span>
      <button class="icon-btn" id="refresh" title="Actualizar" aria-label="Actualizar"></button>
      <div class="who"><b id="whoName">--</b><span id="whoRol"></span></div>
      <button class="icon-btn" id="btnSalir" title="Salir" aria-label="Salir"></button>
    </div>
    <nav class="bar-nav" aria-label="Secciones">
      <a class="btn sm" id="linkNuevo" href="index.html">Nuevo registro</a>
      <button class="btn sm hidden" id="btnUsuarios">Usuarios</button>
      <button class="btn sm hidden" id="btnConfig">Plazos</button>
    </nav>
  </header>

  <main class="shell" id="agendaView">
    <aside class="side">
      <div class="panel">
        <div class="cal-head">
          <button class="icon-btn" id="prev" title="Mes anterior" aria-label="Mes anterior"></button>
          <h2 id="title">--</h2>
          <button class="btn text" id="today">Hoy</button>
          <button class="icon-btn" id="next" title="Mes siguiente" aria-label="Mes siguiente"></button>
        </div>
        <div class="dows"><div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div></div>
        <div class="cells" id="grid"></div>
        <div class="cal-foot">
          <div class="sum" id="monthSum"></div>
          <select id="sedeFilter" aria-label="Filtrar por sede"><option value="">Todas las sedes</option></select>
        </div>
      </div>
    </aside>
    <section id="dayView" aria-live="polite"></section>
  </main>

  <main class="narrow hidden" id="usersView"></main>
  <main class="narrow hidden" id="configView"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="panel.js"></script>
<script src="pwa.js"></script>
</body>
</html>
